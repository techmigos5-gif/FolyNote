      (function() {
        // Universal guard against "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        var origDefineProperty = Object.defineProperty;
        var origDefineProperties = Object.defineProperties;

        function makeSafeFetchDescriptor(desc) {
          if (!desc) return desc;
          var currentVal;
          var origGet = desc.get;
          var origSet = desc.set;
          return {
            configurable: true,
            enumerable: desc.enumerable !== undefined ? desc.enumerable : true,
            get: function() {
              if (currentVal !== undefined) return currentVal;
              return origGet ? origGet.call(this) : desc.value;
            },
            set: function(val) {
              currentVal = val;
              if (origSet) {
                try { origSet.call(this, val); } catch (e) {}
              }
            }
          };
        }

        Object.defineProperty = function(obj, prop, descriptor) {
          if (prop === 'fetch' && descriptor && descriptor.get && !descriptor.set) {
            try {
              return origDefineProperty.call(this, obj, prop, makeSafeFetchDescriptor(descriptor));
            } catch (err) {}
          }
          return origDefineProperty.apply(this, arguments);
        };

        if (origDefineProperties) {
          Object.defineProperties = function(obj, props) {
            if (props && props.fetch && props.fetch.get && !props.fetch.set) {
              try {
                Object.defineProperty(obj, 'fetch', props.fetch);
                var restProps = Object.assign({}, props);
                delete restProps.fetch;
                return origDefineProperties.call(this, obj, restProps);
              } catch (e) {}
            }
            return origDefineProperties.apply(this, arguments);
          };
        }

        function ensureSettable(target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && desc.configurable && desc.get && !desc.set) {
              origDefineProperty.call(Object, target, 'fetch', makeSafeFetchDescriptor(desc));
            }
          } catch (e) {}
        }
        ensureSettable(window);
        if (typeof Window !== 'undefined' && Window.prototype) ensureSettable(Window.prototype);
        if (typeof globalThis !== 'undefined') ensureSettable(globalThis);

        // Filter benign Vite websocket disconnection console logs in AI Studio preview
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (firstArg && (
            (typeof firstArg === 'string' && firstArg.indexOf('[vite]') !== -1) ||
            (firstArg.message && typeof firstArg.message === 'string' && firstArg.message.indexOf('[vite]') !== -1)
          )) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
        var origConsoleWarn = console.warn;
        console.warn = function() {
          var firstArg = arguments[0];
          if (firstArg && (
            (typeof firstArg === 'string' && firstArg.indexOf('[vite]') !== -1) ||
            (firstArg.message && typeof firstArg.message === 'string' && firstArg.message.indexOf('[vite]') !== -1)
          )) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && typeof e.message === 'string' && e.message.indexOf('[vite]') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
