<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#5B3CC4"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1ECFF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5B3CC4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#softGlow)"/>
  <!-- Lotus Petals -->
  <g transform="translate(0, 10)">
    <!-- Center petal -->
    <path d="M 256 120 C 275 180 300 240 300 280 C 300 315 280 340 256 340 C 232 340 212 315 212 280 C 212 240 237 180 256 120 Z" fill="url(#petalGrad)"/>
    <!-- Left petal -->
    <path d="M 240 250 C 210 180 155 210 145 250 C 135 290 165 330 205 336 C 220 338 234 330 245 315 C 235 295 235 270 240 250 Z" fill="url(#petalGrad)" opacity="0.95"/>
    <!-- Right petal -->
    <path d="M 272 250 C 302 180 357 210 367 250 C 377 290 347 330 307 336 C 292 338 278 330 267 315 C 277 295 277 270 272 250 Z" fill="url(#petalGrad)" opacity="0.95"/>
    <!-- Bottom base arc -->
    <path d="M 215 342 C 238 352 274 352 297 342 C 285 365 227 365 215 342 Z" fill="url(#petalGrad)" opacity="0.8"/>
  </g>
</svg>
